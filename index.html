<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1115" media="(prefers-color-scheme: dark)">
<meta name="description" content="腕時計の購入情報・着用記録・メンテナンス履歴から、次回オーバーホールの時期を管理します。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時計台帳">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light dark}
body{margin:0; -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>時計メンテナンス台帳</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9ECEF;
  --surface:#FFFFFF;
  --surface-2:#F3F5F8;
  --ink:#141A20;
  --ink-2:#4C5866;
  --ink-3:#7A8694;
  --line:#D2D8DF;
  --line-2:#B7C0C9;
  --accent:#7A6534;
  --accent-2:#A98F50;
  --accent-soft:#EFE7D6;
  --cal:#26599C;   --cal-soft:#E0E9F5;
  --act:#B3352B;   --act-soft:#F8E3E0;
  --ok:#186C53;    --ok-soft:#DBEDE6;
  --soon:#A85A0A;  --soon-soft:#F8E5D0;
  --over:#A32220;  --over-soft:#F9DEDC;
  --shadow:0 1px 2px rgba(16,22,28,.05), 0 10px 26px -14px rgba(16,22,28,.22);
  --radius:10px;
  --f-display:'Zen Old Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --f-body:'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1115; --surface:#161B21; --surface-2:#1C232A;
    --ink:#E7ECF1; --ink-2:#A2AEBA; --ink-3:#76828E;
    --line:#252D35; --line-2:#3A444E;
    --accent:#C8A96A; --accent-2:#9B865A; --accent-soft:#332A18;
    --cal:#7FA8DD; --cal-soft:#16243A;
    --act:#F0796F; --act-soft:#3B1D1A;
    --ok:#4FBF9B;   --ok-soft:#12332B;
    --soon:#E8913E; --soon-soft:#3A2814;
    --over:#F0796F; --over-soft:#3C1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 34px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#161B21; --surface-2:#1C232A;
  --ink:#E7ECF1; --ink-2:#A2AEBA; --ink-3:#76828E;
  --line:#252D35; --line-2:#3A444E;
  --accent:#C8A96A; --accent-2:#9B865A; --accent-soft:#332A18;
  --cal:#7FA8DD; --cal-soft:#16243A;
  --act:#F0796F; --act-soft:#3B1D1A;
  --ok:#4FBF9B;   --ok-soft:#12332B;
  --soon:#E8913E; --soon-soft:#3A2814;
  --over:#F0796F; --over-soft:#3C1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 34px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:0 56px}
h1,h2,h3{font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}
.eyebrow{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:500}

/* ---------- masthead ---------- */
.mast{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.mast-in{max-width:1040px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand h1{font-size:19px; letter-spacing:.04em; white-space:nowrap}
.brand .rule{height:1px; width:28px; background:var(--accent-2); flex:none; align-self:center}
.badge{font-size:11px; padding:3px 9px; border-radius:99px; white-space:nowrap;
  border:1px solid var(--line-2); color:var(--ink-3); background:var(--surface)}
.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:7px 14px; border-radius:8px; font-size:13.5px; font-weight:500;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:var(--accent-2)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{color:#17130A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{filter:brightness(1.08); border-color:var(--accent)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:7px 10px}
.btn-ghost:hover{color:var(--ink); background:var(--surface-2); border-color:transparent}
.btn-danger{color:var(--over); border-color:var(--over)}
.btn-danger:hover{background:var(--over-soft)}
.btn-sm{padding:5px 11px; font-size:12.5px}
.btn:disabled{opacity:.4; cursor:not-allowed}

.alert{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--soon-soft); border:1px solid color-mix(in srgb, var(--soon) 40%, transparent);
  color:var(--ink); border-radius:var(--radius); padding:11px 15px; margin-top:20px; font-size:13px}
.alert b{color:var(--soon)}
.alert .btn{margin-left:auto}

/* ---------- summary strip ---------- */
.strip{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:22px 0 26px}
.strip div{background:var(--surface); padding:13px 15px}
.strip .k{font-size:10.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase}
.strip .v{font-family:var(--f-mono); font-size:21px; font-weight:500; margin-top:3px; font-variant-numeric:tabular-nums}
.strip .v small{font-size:11px; font-family:var(--f-body); color:var(--ink-3); margin-left:3px; font-weight:400}
@media(max-width:720px){ .strip{grid-template-columns:repeat(2,1fr)} }

/* ---------- collection ---------- */
.sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
.sec-head h2{font-size:15px; letter-spacing:.1em}
.sec-head .line{flex:1; height:1px; background:var(--line)}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
@media(max-width:760px){ .grid{grid-template-columns:1fr} }

.card{position:relative; text-align:left; width:100%; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px 13px 20px;
  box-shadow:var(--shadow); transition:transform .14s, border-color .14s; display:block}
.card:hover{transform:translateY(-2px); border-color:var(--line-2)}
.card::before{content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px;
  border-radius:0 3px 3px 0; background:var(--st)}
.card-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card-id{display:flex; gap:12px; min-width:0; align-items:flex-start}
.thumb{width:54px; height:54px; border-radius:8px; object-fit:cover; flex:none;
  border:1px solid var(--line); background:var(--surface-2)}
.thumb.ph{display:grid; place-items:center; color:var(--ink-3); font-size:20px}
.card .maker{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.card .model{font-family:var(--f-display); font-size:18px; line-height:1.35; margin-top:1px}
.card .yr{font-size:12px; color:var(--ink-3); margin-top:2px}
.nums{text-align:right; flex:none}
.nums .big{font-family:var(--f-mono); font-size:27px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
.nums .sub{font-family:var(--f-mono); font-size:14px; font-weight:500; line-height:1.2; margin-top:5px; font-variant-numeric:tabular-nums}
.nums .lb{font-size:10px; letter-spacing:.08em; color:var(--ink-3)}
.t-act{color:var(--act)}
.t-cal{color:var(--cal)}
.bars{margin-top:12px; display:flex; flex-direction:column; gap:3px}
.bar{height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%}
.bar.b-cal i{background:var(--cal)}
.bar.b-act i{background:var(--act)}
.card-foot{display:flex; justify-content:space-between; gap:10px; margin-top:9px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; align-items:center}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500;
  padding:2px 8px; border-radius:99px; background:var(--st-soft); color:var(--st);
  border:1px solid color-mix(in srgb, var(--st) 35%, transparent)}
.chip::before{content:''; width:5px; height:5px; border-radius:99px; background:currentColor}
.tag{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-3); background:var(--surface-2)}
.s-ok{--st:var(--ok); --st-soft:var(--ok-soft)}
.s-soon{--st:var(--soon); --st-soft:var(--soon-soft)}
.s-over{--st:var(--over); --st-soft:var(--over-soft)}
.s-none{--st:var(--ink-3); --st-soft:var(--surface-2)}
.s-q{--st:var(--cal); --st-soft:var(--cal-soft)}

/* ---------- empty ---------- */
.empty{border:1px dashed var(--line-2); border-radius:var(--radius); padding:44px 24px; text-align:center; background:var(--surface)}
.empty h2{font-size:20px; margin-bottom:8px}
.empty p{color:var(--ink-2); max-width:46ch; margin:0 auto 20px; font-size:14px}
.empty .acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* ---------- detail ---------- */
.back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); background:none; border:0; padding:14px 0; margin:0}
.back:hover{color:var(--accent-2)}
.hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px; display:flex; gap:24px; align-items:center; flex-wrap:wrap}
.hero .info{flex:1; min-width:230px}
.hero h2{font-size:25px; line-height:1.3}
.hero .idrow{display:flex; gap:14px; align-items:center}
.hero .idrow img{width:66px; height:66px; border-radius:9px; object-fit:cover; border:1px solid var(--line); flex:none}
.ringwrap{position:relative; width:132px; height:132px; flex:none}
.ringwrap .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ringwrap .mid b{font-family:var(--f-mono); font-size:23px; font-weight:500; line-height:1; color:var(--act); font-variant-numeric:tabular-nums}
.ringwrap .mid u{font-family:var(--f-mono); font-size:13px; font-weight:500; text-decoration:none; color:var(--cal); font-variant-numeric:tabular-nums; margin-top:3px}
.ringwrap .mid span{font-size:9.5px; color:var(--ink-3); letter-spacing:.05em}

.dual{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.dual > div{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface-2); border-left-width:3px}
.dual .d-cal{border-left-color:var(--cal)}
.dual .d-act{border-left-color:var(--act)}
.dual .k{font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase}
.dual .date{font-family:var(--f-mono); font-size:15px; font-weight:500; margin-top:3px; font-variant-numeric:tabular-nums}
.dual .rem{font-family:var(--f-mono); font-size:20px; font-weight:500; line-height:1.2; font-variant-numeric:tabular-nums}
.dual .rem small{font-size:11px; font-family:var(--f-body); font-weight:400; color:var(--ink-3)}
.dual .prog{font-size:11px; color:var(--ink-3); font-family:var(--f-mono); margin-top:3px}
@media(max-width:520px){ .dual{grid-template-columns:1fr} }
.hero .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}

.qbox{flex:none; text-align:center; padding:14px 20px; border:1px solid var(--line);
  border-left:3px solid var(--cal); border-radius:9px; background:var(--surface-2)}
.qbox .n{font-family:var(--f-mono); font-size:32px; font-weight:500; line-height:1; color:var(--cal); font-variant-numeric:tabular-nums}
.qbox .k{font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); margin-top:5px}

.tabs{display:flex; gap:2px; margin:26px 0 0; border-bottom:1px solid var(--line); overflow-x:auto}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 14px; font-size:13.5px; color:var(--ink-3); white-space:nowrap; font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent-2)}
.panel{background:var(--surface); border:1px solid var(--line); border-top:0;
  border-radius:0 0 var(--radius) var(--radius); padding:20px; box-shadow:var(--shadow)}

.photo-full{width:100%; max-height:280px; object-fit:contain; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--line); margin-bottom:16px}
.spec{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.spec div{background:var(--surface); padding:11px 14px}
.spec .k{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.spec .v{margin-top:2px; font-size:14.5px}
.spec .v.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
@media(max-width:560px){ .spec{grid-template-columns:1fr} }

.note{font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-left:3px solid var(--accent-2);
  border-radius:0 8px 8px 0; padding:11px 14px; margin-top:18px}
.note b{color:var(--ink); font-weight:500}
.note.cap{border-left-color:var(--soon)}
.note.blue{border-left-color:var(--cal)}

/* ---------- calendar ---------- */
.calbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.calbar .mo{font-family:var(--f-display); font-size:18px; min-width:9ch}
.calbar .nav{display:flex; gap:4px; margin-left:auto}
.calbar .nav button{width:32px; height:32px; display:grid; place-items:center; padding:0}
.bulk{border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
  padding:11px 12px; margin-bottom:14px; display:flex; flex-direction:column; gap:9px}
.bulk .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.bulk .lbl{font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase; flex:none}
.dowpick{display:flex; gap:4px; flex-wrap:wrap}
.dowpick button{width:34px; height:34px; padding:0; border-radius:8px; border:1px solid var(--line-2);
  background:var(--surface); font-size:13px; display:grid; place-items:center}
.dowpick button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .dowpick button[aria-pressed="true"], :root:not([data-theme="light"]) .dowpick button[aria-pressed="true"]{color:#17130A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .dowpick button[aria-pressed="true"]{color:#fff}}
.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px}
.dow span{text-align:center; font-size:10.5px; color:var(--ink-3); letter-spacing:.08em}
.dow span:first-child{color:var(--over)}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.day{aspect-ratio:1/1; min-height:40px; border:1px solid var(--line); border-radius:7px;
  background:var(--surface-2); color:var(--ink-2); font-family:var(--f-mono); font-size:13.5px;
  display:grid; place-items:center; padding:0; transition:background .12s, border-color .12s}
.day:hover:not(:disabled){border-color:var(--accent-2)}
.day.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .day.on, :root:not([data-theme="light"]) .day.on{color:#17130A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .day.on{color:#fff}}
.day.run{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent-2) 45%, transparent); color:var(--accent)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent-2)}
.day:disabled{opacity:.35; cursor:default; background:transparent}
.day.blank{border:0; background:none; cursor:default}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid var(--line)}
.legend i.w{background:var(--accent); border-color:var(--accent)}
.legend i.r{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent-2) 45%, transparent)}
.legend i.n{background:var(--surface-2)}
.mstats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:16px}
.mstats div{background:var(--surface); padding:10px 13px; text-align:center}
.mstats .k{font-size:10.5px; letter-spacing:.1em; color:var(--ink-3)}
.mstats .v{font-family:var(--f-mono); font-size:19px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums}

/* ---------- history / table ---------- */
.hist{display:flex; flex-direction:column; gap:10px}
.hrow{display:flex; gap:14px; align-items:flex-start; justify-content:space-between;
  border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--surface-2); border-left-width:3px}
.hrow.oh{border-left-color:var(--accent-2)}
.hrow.rp{border-left-color:var(--line-2)}
.hrow .d{font-family:var(--f-mono); font-size:13.5px; color:var(--ink-3); font-weight:500}
.hrow .c{font-size:14.5px; margin-top:2px}
.hrow .s{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.hrow .amt{font-family:var(--f-mono); font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}
.kind{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:99px; margin-left:6px; vertical-align:1px}
.kind.oh{background:var(--accent-soft); color:var(--accent); border:1px solid color-mix(in srgb, var(--accent-2) 40%, transparent)}
.kind.rp{background:var(--surface); color:var(--ink-3); border:1px solid var(--line-2)}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; max-height:460px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px}
th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  font-weight:500; background:var(--surface-2); position:sticky; top:0; z-index:1}
tbody td{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tr.part td{color:var(--ink-3)}
tfoot td{font-weight:600; background:var(--surface-2); font-family:var(--f-mono); position:sticky; bottom:0}

/* ---------- modal / forms ---------- */
.veil{position:fixed; inset:0; z-index:60; background:rgba(10,14,18,.55);
  display:flex; align-items:flex-start; justify-content:center; overflow-y:auto;
  padding:24px 16px; backdrop-filter:blur(2px)}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5); width:100%; max-width:540px; padding:22px; margin:auto}

<script>
(function(){
"use strict";

/* ============ makers ============ */
var MAKERS = [
  ['日本', ['GRAND SEIKO','SEIKO','CREDOR','CITIZEN','THE CITIZEN','CAMPANOLA','CASIO','G-SHOCK','ORIENT','ORIENT STAR','MINASE','KURONO TOKYO','NAOYA HIDA','KNOT','SPQR']],
  ['スイス', ['ROLEX','TUDOR','OMEGA','PATEK PHILIPPE','AUDEMARS PIGUET','VACHERON CONSTANTIN','JAEGER-LECOULTRE','IWC','BREGUET','BLANCPAIN','CARTIER','PANERAI','HUBLOT','ZENITH','TAG HEUER','BREITLING','LONGINES','ORIS','HAMILTON','TISSOT','RADO','MIDO','CERTINA','CHOPARD','PIAGET','ULYSSE NARDIN','GIRARD-PERREGAUX','BELL & ROSS','BAUME & MERCIER','MONTBLANC','FREDERIQUE CONSTANT','MAURICE LACROIX','RAYMOND WEIL','EDOX','BALL','DOXA','SQUALE','SWATCH','VICTORINOX','ALPINA','CORUM','FRANCK MULLER','H. MOSER & CIE','RICHARD MILLE','ROGER DUBUIS','PARMIGIANI FLEURIER','F.P. JOURNE','TITONI','ETERNA']],
  ['ドイツ', ['A. LANGE & SÖHNE','GLASHÜTTE ORIGINAL','NOMOS GLASHÜTTE','SINN','JUNGHANS','MÜHLE GLASHÜTTE','UNION GLASHÜTTE','STOWA','LACO','HANHART','DAMASKO']],
  ['その他', ['BREMONT','CHRISTOPHER WARD','FARER','SMITHS','MARATHON','TIMEX','BULOVA','SHINOLA','LUMINOX','MONDAINE','BRAUN','STURMANSKIE','VOSTOK','APPLE','GARMIN','SUUNTO','FOSSIL','SKAGEN','DANIEL WELLINGTON','NIXON']]
];
var DOW = ['日','月','火','水','木','金','土'];

/* ============ utilities ============ */
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYMD(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addYears(d,n){ return new Date(d.getFullYear()+n, d.getMonth(), d.getDate()); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function mkey(y,m){ return y+'-'+pad(m); }
function jpDate(s){ if(!s) return '—'; var d=parseYMD(s); return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); }
function yen(n){ if(n==null||n==='') return '—'; return '¥'+Number(n).toLocaleString('ja-JP'); }
function uid(){ return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function serial(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function yearsMonths(days){
  var y = Math.floor(days/365.25), m = Math.floor((days - y*365.25)/30.44);
  return (y ? y + '年' : '') + m + 'か月';
}

/* ============ state ============ */
var DEFAULT_CFG = { intervalYears:4, maxYears:8, carryDays:2 };
var state = { watches:{}, usage:{}, photos:{}, config:Object.assign({},DEFAULT_CFG) };
var view  = { name:'list', id:null, tab:'overview', showAll:false };
var cal = null, dowSel = {};
var formPhoto = null;
var DB = null, mode = 'local';
var IS_HOSTED = !!(window.claude && window.claude.use);
var LS = 'watch-ledger-v1';
var fileHandle = null, filePerm = 'none', fileName = '';

function loadLocal(){
  try{ var raw = localStorage.getItem(LS); if(raw) apply(JSON.parse(raw)); }catch(e){}
}
function apply(o){
  if(!o || typeof o !== 'object') return;
  state.watches = o.watches || {};
  state.usage   = o.usage   || {};
  state.photos  = o.photos  || {};
  state.config  = Object.assign({}, DEFAULT_CFG, o.config || {});
}
function snapshotData(){
  return { app:'watch-ledger', version:3, savedAt:new Date().toISOString(),
           watches:state.watches, usage:state.usage, photos:state.photos, config:state.config };
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(snapshotData())); }
  catch(e){ toast('保存領域がいっぱいです。写真を減らすか、バックアップを書き出して整理してください。'); }
  scheduleFileWrite();
}

/* ---- optional: keep a real .json file on disk in sync ---- */
var fileTimer = null;
function scheduleFileWrite(){
  if(!fileHandle || filePerm !== 'granted') return;
  clearTimeout(fileTimer);
  fileTimer = setTimeout(writeFile, 700);
}
async function writeFile(){
  if(!fileHandle || filePerm !== 'granted') return;
  try{
    var w = await fileHandle.createWritable();
    await w.write(JSON.stringify(snapshotData(), null, 2));
    await w.close();
  }catch(e){ filePerm = 'none'; renderBanner(); toast('データファイルに書き込めませんでした。設定から接続し直してください。'); }
}
function idb(fn){
  return new Promise(function(res){
    var r;
    try{ r = indexedDB.open('watch-ledger', 1); }catch(e){ return res(null); }
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onerror = function(){ res(null); };
    r.onsuccess = function(){ try{ fn(r.result, res); }catch(e){ res(null); } };
  });
}
function idbGet(k){ return idb(function(db,res){
  var t = db.transaction('kv','readonly').objectStore('kv').get(k);
  t.onsuccess = function(){ res(t.result || null); }; t.onerror = function(){ res(null); };
}); }
function idbSet(k,v){ return idb(function(db,res){
  var t = db.transaction('kv','readwrite').objectStore('kv').put(v,k);
  t.onsuccess = function(){ res(true); }; t.onerror = function(){ res(null); };
}); }

async function linkFile(){
  if(!window.showSaveFilePicker){ toast('この環境ではファイル保存に対応していません。バックアップの書き出しをお使いください。'); return; }
  try{
    var h = await window.showSaveFilePicker({
      suggestedName: '時計メンテナンス台帳.json',
      types:[{description:'台帳データ (JSON)', accept:{'application/json':['.json']}}]
    });
    fileHandle = h; filePerm = 'granted'; fileName = h.name;
    await idbSet('fileHandle', h);
    await writeFile();
    renderBanner(); render();
    toast('データファイルに接続しました。以後、変更のたびに自動保存されます。');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast('ファイルに接続できませんでした（' + (e && e.name || '不明') + '）');
  }
}
async function reconnectFile(ask){
  if(!fileHandle || !fileHandle.queryPermission) return;
  try{
    var p = await fileHandle.queryPermission({mode:'readwrite'});
    if(p !== 'granted' && ask) p = await fileHandle.requestPermission({mode:'readwrite'});
    filePerm = p;
    if(p === 'granted'){
      try{
        var txt = await (await fileHandle.getFile()).text();
        if(txt.trim()){
          var o = JSON.parse(txt);
          var localAt = (JSON.parse(localStorage.getItem(LS)||'{}').savedAt) || '';
          if(!localAt || (o.savedAt || '') >= localAt) apply(o); else scheduleFileWrite();
        }
      }catch(e){}
      fileName = fileHandle.name;
    }
  }catch(e){ filePerm = 'none'; }
  renderBanner(); render();
}
async function unlinkFile(){
  fileHandle = null; filePerm = 'none'; fileName = '';
  await idbSet('fileHandle', null);
  renderBanner(); render();
  toast('データファイルの接続を解除しました。データはこのブラウザに残っています。');
}

function exportBackup(){
  var blob = new Blob([JSON.stringify(snapshotData(), null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '時計メンテナンス台帳_' + ymd(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();

$('#impFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(!o.watches) throw new Error('形式が違います');
      apply(o);
      if(mode === 'db') pushAllToDb(); else saveLocal();
      view = {name:'list', tab:'overview'}; render();
      toast('バックアップを読み込みました（' + Object.keys(state.watches).length + ' 本）');
    }catch(err){ toast('読み込めませんでした：' + (err.message || '不明なファイル')); }
  };
  rd.readAsText(f); e.target.value = '';
});

/* ---- photos: shrink before storing so one watch stays well inside the limits ---- */
var PHOTO_BUDGET = 170000;
function loadPhoto(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(null); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null); };
    img.onload = function(){
      function encode(maxPx, q){
        var s = Math.min(1, maxPx / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width  = Math.max(1, Math.round(img.width  * s));
        cv.height = Math.max(1, Math.round(img.height * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        return cv.toDataURL('image/jpeg', q);
      }
      var q = 0.8, out = encode(900, q);
      while(out.length > PHOTO_BUDGET && q > 0.4){ q -= 0.12; out = encode(900, q); }
      if(out.length > PHOTO_BUDGET) out = encode(620, 0.62);
      if(out.length > PHOTO_BUDGET) out = encode(440, 0.55);
      cb(out.length > PHOTO_BUDGET ? null : out);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
$('#photoFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  e.target.value = '';
  toast('画像を読み込んでいます…');
  loadPhoto(f, function(dataUrl){
    if(!dataUrl){ toast('この画像は読み込めませんでした。別の画像をお試しください。'); return; }
    formPhoto = dataUrl;
    var pv = $('#photoPreview');
    if(pv){
      pv.outerHTML = '<img id="photoPreview" class="pv" src="' + dataUrl + '" alt="登録した時計の写真">';

    }
    toast('画像を選びました。「保存」で登録されます。');
  });
});

/* one write at a time per document, coalescing bursts */
var wq = {};
function enqueue(path, fn){
  var st = wq[path] || (wq[path] = {busy:false, latest:null});
  st.latest = fn;
  if(st.busy) return;
  st.busy = true;
  (async function(){
    try{ while(st.latest){ var f = st.latest; st.latest = null; await f(); } }
    catch(e){ toast('保存できませんでした（' + (e && (e.code||e.message) || '不明') + '）'); }
    finally{ st.busy = false; }
  })();
}
async function pushAllToDb(){
  var ids = Object.keys(state.watches);
  for(var i=0;i<ids.length;i++){
    await DB.doc('watches/'+ids[i]).set(state.watches[ids[i]]);
    if(state.usage[ids[i]])  await DB.doc('usage/'+ids[i]).set(state.usage[ids[i]]);
    if(state.photos[ids[i]]) await DB.doc('photos/'+ids[i]).set(state.photos[ids[i]]);
  }
  await DB.doc('config/app').set(state.config);
}
function putWatch(id, w){
  state.watches[id] = w; render();
  if(mode==='db') enqueue('watches/'+id, function(){ return DB.doc('watches/'+id).set(w); });
  else saveLocal();
}
function putPhoto(id, dataUrl){
  if(dataUrl){
    state.photos[id] = {dataUrl:dataUrl};
    if(mode==='db') enqueue('photos/'+id, function(){ return DB.doc('photos/'+id).set({dataUrl:dataUrl}); });
  }else{
    delete state.photos[id];
    if(mode==='db') enqueue('photos/'+id, function(){ return DB.doc('photos/'+id).delete(); });
  }
  if(mode!=='db') saveLocal();
  render();
}
function removeWatch(id){
  delete state.watches[id]; delete state.usage[id]; delete state.photos[id]; render();
  if(mode==='db'){
    enqueue('watches/'+id, function(){ return DB.doc('watches/'+id).delete(); });
    enqueue('usage/'+id,   function(){ return DB.doc('usage/'+id).delete(); });
    enqueue('photos/'+id,  function(){ return DB.doc('photos/'+id).delete(); });
  } else saveLocal();
}
function putUsage(id, u){
  state.usage[id] = u; render();
  if(mode==='db') enqueue('usage/'+id, function(){ return DB.doc('usage/'+id).set(u); });
  else saveLocal();
}
function putConfig(c){
  state.config = c; render();
  if(mode==='db') enqueue('config/app', function(){ return DB.doc('config/app').set(c); });
  else saveLocal();
}

/* ============ the maintenance maths ============ */
/* Every day the movement is turning: each worn day, plus the `carry` days after it.
   A run of consecutive wear therefore keeps running until `carry` days after the LAST day. */
function runningSet(u, carry){
  var set = {}, mm = (u && u.months) || {};
  Object.keys(mm).forEach(function(k){
    var p = k.split('-'), y = +p[0], m = +p[1];
    if(!y || !m) return;
    (mm[k]||[]).forEach(function(d){
      var s = serial(new Date(y, m-1, d));
      for(var i=0;i<=carry;i++) set[s+i] = 1;
    });
  });
  return set;
}
function isQuartz(w){ return w.movement === 'クオーツ'; }
function maintType(m){ return m.type === 'repair' ? 'repair' : 'overhaul'; }

function schedule(w, u, cfg){
  if(!w.purchaseDate) return null;
  var ms = (w.maintenances||[]).slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var ohs = ms.filter(function(m){ return maintType(m) === 'overhaul'; });
  var last = ohs.length ? ohs[ohs.length-1].date : null;
  var quartz = isQuartz(w);
  var baseStr = (quartz ? null : last) || w.purchaseDate;
  var base = parseYMD(baseStr), now = today();
  var elapsed = Math.max(0, diffDays(base, now));

  var carry = cfg.carryDays == null ? 2 : cfg.carryDays;
  var interval = cfg.intervalYears || 4;
  var target = diffDays(base, addYears(base, interval));   /* 4年分 ＝ 必要な稼働日数 */
  var rs = runningSet(u, carry);
  /* accumulate running days, remembering the day the target was reached (it may be in the past) */
  var bs = serial(base), used = 0, hit = -1, span = Math.min(elapsed, 366*40);
  for(var i=0;i<span;i++){
    if(rs[bs+i]){ used++; if(hit < 0 && used >= target) hit = i; }
  }

  var out = {
    quartz:quartz, base:base, baseStr:baseStr,
    baseKind: (!quartz && last) ? 'overhaul' : 'purchase',
    elapsed:elapsed, used:used, carry:carry, maints:ms, overhauls:ohs
  };
  if(quartz) return out;

  var maxY = Math.max(interval, cfg.maxYears || 8);
  var maxDue = addYears(base, maxY);

  var dueCal = addYears(base, interval);                   /* 基準（青）: 使用と無関係 */
  /* 実質（赤）: 到達済みならその日、未到達なら明日から毎日着け続けた場合の日 */
  var dueAct = hit >= 0 ? addDays(base, hit + 1) : addDays(now, Math.max(0, target - used));
  var capped = dueAct > maxDue;
  if(capped) dueAct = maxDue;

  out.interval = interval; out.maxY = maxY; out.target = target;
  out.dueCal = dueCal; out.remainCal = diffDays(now, dueCal);
  out.dueAct = dueAct; out.remainAct = diffDays(now, dueAct);
  out.capped = capped; out.maxDue = maxDue;
  out.progCal = Math.max(0, Math.min(1, elapsed / target));
  out.progAct = Math.max(0, Math.min(1, used / target));
  return out;
}

function statusOf(s){
  if(!s) return {cls:'s-none', label:'購入日が未入力'};
  if(s.quartz) return {cls:'s-q', label:'クオーツ'};
  if(s.remainAct < 0)    return {cls:'s-over', label:'期限超過'};
  if(s.remainAct <= 180) return {cls:'s-soon', label:'要点検'};
  return {cls:'s-ok', label:'良好'};
}

function summary(cfg){
  var ids = Object.keys(state.watches);
  var over = 0, soon = 0, next = null, spend = 0;
  ids.forEach(function(id){
    var w = state.watches[id];
    (w.maintenances||[]).forEach(function(m){ spend += Number(m.cost)||0; });
    var s = schedule(w, state.usage[id], cfg);
    if(!s || s.quartz) return;
    if(s.remainAct < 0) over++; else if(s.remainAct <= 180) soon++;
    if(!next || s.remainAct < next.rem) next = {rem:s.remainAct};
  });
  return {n:ids.length, over:over, soon:soon, next:next, spend:spend};
}

/* Two concentric arcs: outer = calendar progress (blue), inner = running-day progress (red). */
function dualRing(pCal, pAct, midHTML){
  function arc(r, w, color, p){
    var c = 2*Math.PI*r;
    return '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + w + '"></circle>'
      + '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + w + '"'
      + ' stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '"'
      + ' stroke-dashoffset="' + (c * (1 - Math.max(0, Math.min(1, p)))).toFixed(1) + '"'
      + ' transform="rotate(-90 66 66)"></circle>';
  }
  return '<div class="ringwrap"><svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">'
    + arc(57, 8, 'var(--cal)', pCal) + arc(40, 7, 'var(--act)', pAct)
    + '</svg>' + midHTML + '</div>';
}

function calendarHTML(w, u, cfg){
  var now = today();
  if(!cal) cal = {y:now.getFullYear(), m:now.getMonth()+1};
  var carry = cfg.carryDays == null ? 2 : cfg.carryDays;
  var key = mkey(cal.y, cal.m);
  var days = (u.months && u.months[key]) || [];
  var worn = {}; days.forEach(function(d){ worn[d]=1; });
  var dim = daysInMonth(cal.y, cal.m);
  var startDow = new Date(cal.y, cal.m-1, 1).getDay();
  var first = serial(new Date(cal.y, cal.m-1, 1));

  var rs = runningSet(u, carry), run = 0;
  for(var i=0;i<dim;i++) if(rs[first+i]) run++;

  var isFutureMonth = (cal.y > now.getFullYear()) || (cal.y===now.getFullYear() && cal.m > now.getMonth()+1);

  var h = '<div class="calbar">'
    + '<span class="mo">' + cal.y + '年 ' + cal.m + '月</span>'
    + '<button class="btn btn-ghost btn-sm" data-act="thismonth">今月へ</button>'
    + '<span class="nav"><button class="btn" data-act="prevmo" aria-label="前の月">‹</button>'
    + '<button class="btn" data-act="nextmo" aria-label="次の月"' + (isFutureMonth?' disabled':'') + '>›</button></span>'
    + '</div>';

  /* bulk entry, right above the grid */
  h += '<div class="bulk">'
    + '<div class="row"><span class="lbl">まとめ入力</span>'
    + '<button class="btn btn-sm btn-primary" data-act="bulkall">この月を全日</button>'
    + '<button class="btn btn-sm" data-act="bulkclear">この月をクリア</button></div>'
    + '<div class="row"><span class="lbl">曜日で</span><span class="dowpick">';
  for(var d0=0; d0<7; d0++){
    h += '<button type="button" data-dow="' + d0 + '" aria-pressed="' + !!dowSel[d0] + '"'
       + (d0===0 ? ' style="color:var(--over)"' : '') + '>' + DOW[d0] + '</button>';
  }
  h += '</span><button class="btn btn-sm" data-act="bulkdow">選んだ曜日を追加</button></div>'
    + '</div>';

  h += '<div class="dow">';
  for(var d1=0; d1<7; d1++) h += '<span>' + DOW[d1] + '</span>';
  h += '</div><div class="days">';
  for(var b=0;b<startDow;b++) h += '<div class="day blank"></div>';
  for(var d=1; d<=dim; d++){
    var dd = new Date(cal.y, cal.m-1, d);
    var future = dd > now;
    var isToday = ymd(dd) === ymd(now);
    var cls = worn[d] ? ' on' : (rs[first+d-1] ? ' run' : '');
    h += '<button class="day' + cls + (isToday?' today':'') + '"' + (future?' disabled':'')
       + ' data-day="' + d + '" aria-pressed="' + (!!worn[d]) + '" aria-label="' + cal.m + '月' + d + '日">' + d + '</button>';
  }
  h += '</div>';

  h += '<div class="legend">'
     + '<span><i class="w"></i>着用した日</span>'
     + '<span><i class="r"></i>ゼンマイで稼働中（最終着用の ' + carry + ' 日後まで）</span>'
     + '<span><i class="n"></i>停止</span></div>';

  h += '<div class="mstats">'
    + '<div><div class="k">着用日数</div><div class="v">' + days.length + '</div></div>'
    + '<div><div class="k">稼働日数</div><div class="v t-act">' + run + ' <span style="font-size:11px;color:var(--ink-3)">/ ' + dim + '</span></div></div>'
    + '<div><div class="k">停止日数</div><div class="v" style="color:var(--ink-3)">' + (dim - run) + '</div></div>'
    + '</div>';

  h += '<div class="note">'
    + (isQuartz(w)
        ? 'クオーツのため、この記録はオーバーホール時期の計算には使われません。着用の記録としてお使いください。'
        : '着けた日から <b>' + carry + ' 日後</b>までは巻き上げたゼンマイで動き続けているものとして稼働日に数えます。'
          + '連続して着けた場合は、<b>最後に着けた日の ' + carry + ' 日後</b>までが稼働日です。'
          + 'この稼働日だけを積み上げて ' + (cfg.intervalYears||4) + ' 年分になった日が、次回オーバーホールの時期です。')
    + '</div>';
  return h;
}

/* month-by-month running days, from the base month to this month */
function calcHTML(sc, cfg){
  if(!sc) return '<p style="color:var(--ink-2)">購入時期が未入力のため計算できません。</p>';
  var u = state.usage[view.id] || {months:{}};
  var rs = runningSet(u, sc.carry);
  var now = today(), bs = serial(sc.base), ns = serial(now);
  var rows = [], cum = 0;
  var y = sc.base.getFullYear(), m = sc.base.getMonth()+1;
  var ey = now.getFullYear(), em = now.getMonth()+1, guard = 0;
  while((y < ey || (y === ey && m <= em)) && guard++ < 400){
    var dim = daysInMonth(y, m), ms0 = serial(new Date(y, m-1, 1));
    var from = Math.max(ms0, bs), to = Math.min(ms0 + dim - 1, ns - 1);
    if(to >= from){
      var inRange = to - from + 1, run = 0, wornN = 0;
      for(var s = from; s <= to; s++) if(rs[s]) run++;
      (u.months[mkey(y,m)] || []).forEach(function(d){
        var sd = ms0 + d - 1; if(sd >= from && sd <= to) wornN++;
      });
      cum += run;
      rows.push({y:y, m:m, inRange:inRange, worn:wornN, run:run, cum:cum, partial: inRange < dim});
    }
    m++; if(m>12){ m=1; y++; }
  }
  if(!rows.length) return '<p style="color:var(--ink-2)">起算日（' + esc(jpDate(sc.baseStr)) + '）からまだ 1 日も経っていません。</p>';

  var shown = view.showAll ? rows.slice().reverse() : rows.slice(-24).reverse();
  var h = '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap">'
    + '<span class="eyebrow">月別の稼働日数</span>'
    + '<span style="font-size:12.5px;color:var(--ink-2)">'
    + '<span class="t-cal">経過 ' + sc.elapsed + ' 日</span> ／ '
    + '<span class="t-act">稼働 ' + sc.used + ' 日</span> ／ 目標 ' + sc.target + ' 日</span></div>';

  h += '<div class="tblwrap"><table><thead><tr>'
    + '<th>月</th><th>対象日</th><th>着用</th><th>稼働</th><th>停止</th><th>累計稼働</th>'
    + '</tr></thead><tbody>';
  shown.forEach(function(r){
    h += '<tr class="' + (r.partial ? 'part' : '') + '">'
      + '<td>' + r.y + '.' + pad(r.m) + (r.partial ? ' <span style="font-family:var(--f-body);font-size:11px">一部</span>' : '') + '</td>'
      + '<td>' + r.inRange + '</td><td>' + r.worn + '</td>'
      + '<td class="t-act">' + r.run + '</td>'
      + '<td style="color:var(--ink-3)">' + (r.inRange - r.run) + '</td>'
      + '<td>' + r.cum + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td>合計</td><td>' + sc.elapsed + '</td><td></td>'
     + '<td class="t-act">' + sc.used + '</td><td>' + (sc.elapsed - sc.used) + '</td><td>' + sc.used + '</td></tr></tfoot></table></div>';

  if(rows.length > 24){
    h += '<div style="margin-top:12px"><button class="btn" data-act="toggleall">'
       + (view.showAll ? '直近 24 か月だけ表示' : 'すべての ' + rows.length + ' か月を表示') + '</button></div>';
  }
  h += '<div class="note">'
    + '<span class="t-cal">基準</span>：起算日から暦どおり ' + sc.interval + ' 年後の '
    + esc(jpDate(ymd(sc.dueCal))) + '。使用の有無に関係しません。'
    + '<br><span class="t-act">実質</span>：稼働日が ' + sc.target + ' 日に達する日。'
    + '現在 ' + sc.used + ' 日なので、明日から毎日着けたとして ' + esc(jpDate(ymd(sc.dueAct))) + '。'
    + '着けない日が増えるほど後ろへ動きます。'
    + '</div>';
  return h;
}

var toastTimer = null;
function toast(msg){
  var old = $('.toast'); if(old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; el.setAttribute('role','status');
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 4200);
}

/* ============ bulk calendar entry ============ */
function editMonth(fn){
  var u = state.usage[view.id] ? clone(state.usage[view.id]) : {months:{}};
  u.months = u.months || {};
  var key = mkey(cal.y, cal.m);
  var next = fn((u.months[key] || []).slice(), key);
  if(next.length) u.months[key] = next.sort(function(a,b){ return a-b; });
  else delete u.months[key];
  putUsage(view.id, u);
}
function lastEditableDay(){
  var now = today(), dim = daysInMonth(cal.y, cal.m);
  if(cal.y === now.getFullYear() && cal.m === now.getMonth()+1) return now.getDate();
  if(new Date(cal.y, cal.m-1, 1) > now) return 0;
  return dim;
}

/* ============ events ============ */
document.addEventListener('click', function(e){
  if(e.target.id === 'veil'){ closeModal(); return; }
  var t = e.target.closest('[data-open],[data-act],[data-tab],[data-day],[data-cond],[data-mv],[data-dow],[data-delmaint],[data-combo-toggle],[data-maker]');

  var list = $('#makerList');
  if(list && !list.hidden && !e.target.closest('#makerCombo')) list.hidden = true;

  if(!t) return;
  var act = t.getAttribute('data-act');

  if(t.hasAttribute('data-combo-toggle')){
    var l = $('#makerList');
    comboOpen(l.hidden, l.hidden ? $('#f_maker').value : '');
    return;
  }
  if(t.hasAttribute('data-maker')){ $('#f_maker').value = t.getAttribute('data-maker'); comboOpen(false); return; }

  if(t.hasAttribute('data-open')){
    view = {name:'detail', id:t.getAttribute('data-open'), tab:'overview', showAll:false};
    cal = null; window.scrollTo(0,0); render(); return;
  }
  if(t.hasAttribute('data-tab')){ view.tab = t.getAttribute('data-tab'); render(); return; }

  if(t.hasAttribute('data-cond') || t.hasAttribute('data-mv')){
    Array.prototype.forEach.call(t.parentNode.children, function(b){ b.setAttribute('aria-pressed', b===t); });
    return;
  }
  if(t.hasAttribute('data-dow')){
    var k = +t.getAttribute('data-dow');
    dowSel[k] = !dowSel[k];
    t.setAttribute('aria-pressed', !!dowSel[k]);
    return;
  }

  if(t.hasAttribute('data-day')){
    var d = +t.getAttribute('data-day');
    editMonth(function(arr){
      var i = arr.indexOf(d);
      if(i >= 0) arr.splice(i,1); else arr.push(d);
      return arr;
    });
    return;
  }

  if(t.hasAttribute('data-delmaint')){
    var mid = t.getAttribute('data-delmaint');
    var w2 = clone(state.watches[view.id]);
    w2.maintenances = (w2.maintenances||[]).filter(function(m){ return m.id !== mid; });
    putWatch(view.id, w2);
    toast('記録を削除しました');
    return;
  }

  switch(act){
    case 'add':        watchForm(null); break;
    case 'back':       view = {name:'list', tab:'overview'}; window.scrollTo(0,0); render(); break;
    case 'edit':       watchForm(view.id); break;
    case 'addmaint':   maintForm(view.id); break;
    case 'cancel':     closeModal(); break;
    case 'toggleall':  view.showAll = !view.showAll; render(); break;
    case 'thismonth':  var n0 = today(); cal = {y:n0.getFullYear(), m:n0.getMonth()+1}; render(); break;
    case 'prevmo':     cal.m--; if(cal.m<1){cal.m=12; cal.y--;} render(); break;
    case 'nextmo':     cal.m++; if(cal.m>12){cal.m=1; cal.y++;} render(); break;
    case 'sample':     loadSample(); break;
    case 'linkfile':   linkFile(); break;
    case 'unlinkfile': unlinkFile(); break;
    case 'reconnect':  reconnectFile(true); break;
    case 'export':     exportBackup(); break;
    case 'import':     $('#impFile').click(); break;
    case 'pickphoto':  $('#photoFile').click(); break;

    case 'rmphoto': {
      formPhoto = null;
      var pv = $('#photoPreview');
      if(pv) pv.outerHTML = '<span id="photoPreview" class="pv ph" aria-hidden="true">⌚</span>';
      t.hidden = true;
      break;
    }

    case 'bulkall': {
      var lastD = lastEditableDay();
      if(!lastD){ toast('未来の月には登録できません。'); break; }
      editMonth(function(){
        var a = []; for(var i=1;i<=lastD;i++) a.push(i); return a;
      });
      toast(cal.m + ' 月の 1〜' + lastD + ' 日を着用として登録しました');
      break;
    }
    case 'bulkclear':
      editMonth(function(){ return []; });
      toast(cal.m + ' 月の記録を消しました');
      break;
    case 'bulkdow': {
      var picked = Object.keys(dowSel).filter(function(k){ return dowSel[k]; }).map(Number);
      if(!picked.length){ toast('先に曜日を選んでください。'); break; }
      var lim = lastEditableDay();
      if(!lim){ toast('未来の月には登録できません。'); break; }
      var added = 0;
      editMonth(function(arr){
        for(var i=1;i<=lim;i++){
          if(picked.indexOf(new Date(cal.y, cal.m-1, i).getDay()) >= 0 && arr.indexOf(i) < 0){
            arr.push(i); added++;
          }
        }
        return arr;
      });
      toast(picked.map(function(k){ return DOW[k]; }).join('・') + ' 曜日を ' + added + ' 日追加しました');
      break;
    }

    case 'savewatch': {
      var id2 = t.getAttribute('data-id') || '';
      var model = $('#f_model').value.trim();
      if(!model){ $('#f_err').textContent = '購入モデル名を入力してください。'; $('#f_model').focus(); return; }
      var prev = id2 ? state.watches[id2] : null;
      var cond = $('#f_cond').querySelector('[aria-pressed="true"]');
      var mvb  = $('#f_mv').querySelector('[aria-pressed="true"]');
      var w3 = {
        model: model,
        maker: $('#f_maker').value.trim(),
        movement: mvb ? mvb.getAttribute('data-mv') : '機械式',
        modelYear: $('#f_year').value ? +$('#f_year').value : null,
        purchaseDate: $('#f_pdate').value || '',
        price: $('#f_price').value !== '' ? +$('#f_price').value : null,
        shop: $('#f_shop').value.trim(),
        condition: cond ? cond.getAttribute('data-cond') : '新品',
        maintenances: prev ? (prev.maintenances||[]) : [],
        createdAt: prev ? prev.createdAt : new Date().toISOString()
      };
      var newId = id2 || uid();
      var photo = formPhoto;
      var hadUrl = (state.photos[newId] && state.photos[newId].dataUrl) || null;
      putWatch(newId, w3);
      if(photo){ if(photo !== hadUrl) putPhoto(newId, photo); }
      else if(hadUrl) putPhoto(newId, null);
      closeModal();
      if(!id2){ view = {name:'detail', id:newId, tab:'overview', showAll:false}; cal=null; render(); }
      toast(id2 ? '保存しました' : '「' + model + '」を追加しました');
      break;
    }

    case 'savemaint': {
      var wid = t.getAttribute('data-id');
      var date = $('#m_date').value;
      if(!date){ $('#m_err').textContent = '実施日を入力してください。'; return; }
      var ohBox = $('#m_oh');
      var isOh = !isQuartz(state.watches[wid]) && !!(ohBox && ohBox.checked);
      var w4 = clone(state.watches[wid]);
      w4.maintenances = (w4.maintenances||[]).concat([{
        id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        date: date,
        type: isOh ? 'overhaul' : 'repair',
        cost: $('#m_cost').value !== '' ? +$('#m_cost').value : null,
        shop: $('#m_shop').value.trim(),
        content: $('#m_content').value.trim()
      }]);
      putWatch(wid, w4);
      closeModal();
      toast(isOh ? 'オーバーホールを記録し、起算日を更新しました。' : '記録しました。起算日は変わりません。');
      break;
    }

    case 'savecfg': {
      var yrs = +$('#s_years').value || 4;
      var mx  = +$('#s_max').value || 8;
      var cy  = $('#s_carry').value === '' ? 2 : +$('#s_carry').value;
      yrs = Math.max(1, Math.min(20, yrs));
      putConfig({
        intervalYears: yrs,
        maxYears: Math.max(yrs, Math.min(30, mx)),
        carryDays: Math.max(0, Math.min(10, cy))
      });
      closeModal();
      toast('設定を保存しました');
      break;
    }

    case 'delete': {
      var did = t.getAttribute('data-id');
      var nm = state.watches[did] ? state.watches[did].model : '';
      if(t.getAttribute('data-confirm') !== '1'){
        t.setAttribute('data-confirm','1');
        t.textContent = '本当に削除しますか？';
        return;
      }
      removeWatch(did);
      closeModal();
      view = {name:'list', tab:'overview'};
      render();
      toast('「' + nm + '」を削除しました');
      break;
    }
  }
});

  putWatch(c, { model:'サンプル：Eco-Drive', maker:'CITIZEN', movement:'クオーツ', modelYear:2022,
    purchaseDate: back(30, 5), price:52000, shop:'サンプル：量販店', condition:'新品',
    maintenances:[], createdAt:new Date().toISOString() });

  function pattern(step){
    var months = {};
    for(var k=1;k<=18;k++){
      var d = new Date(n.getFullYear(), n.getMonth()-k, 1);
      var y = d.getFullYear(), m = d.getMonth()+1, dim = daysInMonth(y,m), days = [];
      for(var dd=1+(k%step); dd<=dim; dd+=step) days.push(dd);
      months[mkey(y,m)] = days;
    }
    return {months:months};
  }
  putUsage(a, pattern(6));
  putUsage(b, pattern(3));
  toast('サンプル 3 本を読み込みました。不要になったら「情報を編集」から削除できます。');
}

/* ============ boot & sync ============ */
function badge(txt, title){ var el = $('#modeBadge'); el.textContent = txt; el.title = title || ''; }
function onDbErr(e){ if(e && e.code === 'revoked') return; toast('同期エラー（' + (e && e.code || '不明') + '）'); }
function subscribe(){
  try{
    DB.collection('watches').onSnapshot(function(s){
      var o = {}; s.docs.forEach(function(d){ o[d.id] = d.data(); }); state.watches = o; render();
    }, onDbErr);
    DB.collection('usage').onSnapshot(function(s){
      var o = {}; s.docs.forEach(function(d){ o[d.id] = d.data(); }); state.usage = o; render();
    }, onDbErr);
    DB.collection('photos').onSnapshot(function(s){
      var o = {}; s.docs.forEach(function(d){ o[d.id] = d.data(); }); state.photos = o; render();
    }, onDbErr);
    DB.doc('config/app').onSnapshot(function(s){
      if(s.exists) state.config = Object.assign({}, DEFAULT_CFG, s.data());
      render();
    }, onDbErr);
  }catch(e){ onDbErr(e); }
}
async function connect(){
  var db = null;
  try{ db = IS_HOSTED ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){
    badge('この端末に保存', 'データはこの端末の中に保存されます。');
    try{ var h = await idbGet('fileHandle'); if(h){ fileHandle = h; await reconnectFile(false); } }catch(e){}
    renderBanner(); render();
    return;
  }
  DB = db;
  try{
    var snap = await DB.collection('watches').get();
    if(snap.empty && Object.keys(state.watches).length) await pushAllToDb();
  }catch(e){ badge('この端末に保存'); onDbErr(e); return; }
  mode = 'db';
  badge('クラウド同期', 'データはこのアーティファクトに保存され、どの端末からでも同じ内容が見られます。');
  subscribe();
}

loadLocal();
render();
renderBanner();
connect();

})();

(function(){
  if(!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller, reloading = false;
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadController || reloading) return;
    reloading = true; location.reload();
  });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
})();
</script>
