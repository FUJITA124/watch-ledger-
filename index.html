<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E6E3DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<meta name="description" content="腕時計の購入情報・着用記録・メンテナンス履歴・検討リストを管理します。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時計台帳">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light dark}
body{margin:0; -webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>時計メンテナンス台帳</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===================================================================
   Sector Dial — 文字盤の側から。分目盛りと印刷された数字。
   =================================================================== */
:root{
  --bg:#E6E3DB;
  --surface:#F7F5F0;
  --surface-2:#EDEAE2;
  --ink:#14161A;
  --ink-2:#555A61;
  --ink-3:#6E747C;
  --line:#D5D1C6;
  --line-2:#B2ADA0;
  --acc:#14161A;        /* 黒い針 */
  --on-acc:#F7F5F0;
  --acc-soft:#E2DED3;
  --cal:#26599C;   --cal-soft:#DFE8F4;   --cal-line:#9FB8D8;
  --act:#B0342C;   --act-soft:#F7E2DF;   --act-line:#DCA9A3;
  --ok:#1C6B4F;    --ok-soft:#DCEBE3;    --ok-line:#98C2AE;
  --warn:#8A4F0B;  --warn-soft:#F6EBDA;  --warn-line:#D2B78D;
  --over:#96261F;  --over-soft:#F7E0DD;  --over-line:#D9A49E;
  --shadow:0 1px 2px rgba(20,22,26,.05), 0 10px 26px -16px rgba(20,22,26,.30);
  --r:6px;
  --f-display:'Oswald','Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-num:'Oswald','IBM Plex Mono',monospace;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --track:repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 6px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#171A1E; --surface-2:#1E2227;
    --ink:#EDEFF2; --ink-2:#A8AEB6; --ink-3:#848B93;
    --line:#262B31; --line-2:#3A4148;
    --acc:#EDEFF2; --on-acc:#0F1114; --acc-soft:#262B31;
    --cal:#78A2DD;  --cal-soft:#16233A;  --cal-line:#2F4A6E;
    --act:#E4736A;  --act-soft:#37201D;  --act-line:#5C3630;
    --ok:#54BC96;   --ok-soft:#123026;   --ok-line:#28513F;
    --warn:#E0A55C; --warn-soft:#332714; --warn-line:#564225;
    --over:#E4736A; --over-soft:#37201D; --over-line:#5C3630;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#171A1E; --surface-2:#1E2227;
  --ink:#EDEFF2; --ink-2:#A8AEB6; --ink-3:#848B93;
  --line:#262B31; --line-2:#3A4148;
  --acc:#EDEFF2; --on-acc:#0F1114; --acc-soft:#262B31;
  --cal:#78A2DD;  --cal-soft:#16233A;  --cal-line:#2F4A6E;
  --act:#E4736A;  --act-soft:#37201D;  --act-line:#5C3630;
  --ok:#54BC96;   --ok-soft:#123026;   --ok-line:#28513F;
  --warn:#E0A55C; --warn-soft:#332714; --warn-line:#564225;
  --over:#E4736A; --over-soft:#37201D; --over-line:#5C3630;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -20px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:0 60px}
h1,h2,h3{margin:0; font-weight:600; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
a{color:var(--cal)}
:focus-visible{outline:2px solid var(--cal); outline-offset:2px; border-radius:3px}
.eyebrow{font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3); font-weight:500;
  font-family:var(--f-display)}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-weight:500}
.t-cal{color:var(--cal)} .t-act{color:var(--act)}

/* ---------- masthead ---------- */
.mast{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-2)}
.mast::after{content:''; display:block; height:5px; background:var(--track); opacity:.5}
.mast-in{max-width:1040px; margin:0 auto; padding:12px 16px 0}
.mrow1{display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand h1{font-family:var(--f-display); font-size:19px; font-weight:500; letter-spacing:.06em; white-space:nowrap}
.mrow2{display:flex; align-items:center; gap:8px; margin-top:10px; padding-bottom:10px}
.nav{display:flex; gap:2px; border:1px solid var(--line-2); border-radius:var(--r); padding:2px; background:var(--surface-2)}
.nav button{border:0; background:none; padding:6px 13px; border-radius:calc(var(--r) - 2px);
  font-size:13px; color:var(--ink-3); font-weight:500; white-space:nowrap}
.nav button[aria-current="true"]{background:var(--acc); color:var(--on-acc)}
.nav button .n{font-family:var(--f-num); font-size:11px; opacity:.75; margin-left:5px}
.badge{font-size:10.5px; padding:2px 8px; border-radius:99px; white-space:nowrap;
  border:1px solid var(--line-2); color:var(--ink-3); background:var(--surface); margin-left:auto}

.btn{border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:7px 14px; border-radius:var(--r); font-size:13.5px; font-weight:500; white-space:nowrap;
  transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--acc); border-color:var(--acc); color:var(--on-acc)}
.btn-primary:hover{filter:brightness(1.15); border-color:var(--acc)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:7px 10px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--over); border-color:var(--over-line)}
.btn-danger:hover{background:var(--over-soft)}
.btn-sm{padding:5px 11px; font-size:12.5px}
.btn:disabled{opacity:.4; cursor:not-allowed}

.alert{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--ink);
  border-radius:var(--r); padding:11px 15px; margin-top:18px; font-size:13px}
.alert b{color:var(--warn)}
.alert .btn{margin-left:auto}

/* ---------- strips ---------- */
.strip{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; margin:20px 0 0}
.strip.s4{grid-template-columns:repeat(4,1fr)}
.strip.s3{grid-template-columns:repeat(3,1fr); margin-top:10px; margin-bottom:24px}
.strip > div{background:var(--surface); padding:11px 14px}
.strip .k{font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-transform:uppercase; font-family:var(--f-display)}
.strip .v{font-family:var(--f-num); font-size:22px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums; line-height:1.2}
.strip .v small{font-size:10.5px; font-family:var(--f-body); color:var(--ink-3); margin-left:3px; font-weight:400}
.strip .v.money{font-size:17px; font-family:var(--f-mono); font-weight:500}
@media(max-width:720px){ .strip.s4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:520px){
  .strip.s3{grid-template-columns:1fr}
  .strip.s3 > div{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .strip.s3 .v{margin-top:0}
}

.sec-head{display:flex; align-items:center; gap:10px; margin:26px 0 12px; flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display); font-size:15px; font-weight:500; letter-spacing:.14em}
.sec-head .line{flex:1; height:1px; background:var(--line-2); min-width:20px}

/* ---------- cards ---------- */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:13px}
@media(max-width:780px){ .grid{grid-template-columns:1fr} }

.card{position:relative; text-align:left; width:100%; display:block;
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r);
  padding:17px 15px 12px; box-shadow:var(--shadow); overflow:hidden}
.card::before{content:''; position:absolute; left:0; right:0; top:0; height:6px;
  background:var(--track); opacity:.9}
.card.open{cursor:pointer; transition:border-color .14s, transform .14s}
.card.open:hover{border-color:var(--ink-3); transform:translateY(-2px)}
.card.st-line::after{content:''; position:absolute; left:0; top:6px; bottom:0; width:3px; background:var(--st)}

.ctop{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.cid{display:flex; gap:11px; min-width:0}
.thumb{width:52px; height:52px; border-radius:4px; object-fit:cover; flex:none;
  border:1px solid var(--line-2); background:var(--surface-2)}
.thumb.ph{display:grid; place-items:center; color:var(--ink-3); font-size:19px}
.maker{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-family:var(--f-display)}
.model{font-family:var(--f-display); font-size:20px; font-weight:400; line-height:1.25; margin-top:1px; letter-spacing:.01em}
.meta{font-size:11.5px; color:var(--ink-3); margin-top:3px}
.ages{font-size:11.5px; color:var(--ink-2); margin-top:3px}
.ages b{font-family:var(--f-num); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; font-size:12.5px}

.nums{text-align:right; flex:none}
.nums .big{font-family:var(--f-num); font-size:28px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
.nums .sml{font-family:var(--f-num); font-size:15px; font-weight:500; line-height:1.2; margin-top:5px; font-variant-numeric:tabular-nums}
.nums .lb{font-size:9.5px; letter-spacing:.05em; color:var(--ink-3)}

.bars{margin-top:11px; display:flex; flex-direction:column; gap:3px}
.bar{height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%}

.quick{display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; align-items:center}
.qb{font-size:12px; font-weight:500; padding:6px 12px; border-radius:4px;
  border:1px solid var(--acc); background:transparent; color:var(--acc)}
.qb:hover{background:var(--acc-soft)}
.qb.on{background:var(--acc); border-color:var(--acc); color:var(--on-acc)}
.quick .hint{font-size:11px; color:var(--ink-3); margin-left:auto}

.cfoot{display:flex; justify-content:space-between; gap:10px; margin-top:10px;
  font-size:11.5px; color:var(--ink-2); flex-wrap:wrap; align-items:center}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:500;
  padding:2px 9px; border-radius:99px; background:var(--st-soft); color:var(--st); border:1px solid var(--st-line)}
.pill::before{content:''; width:5px; height:5px; border-radius:99px; background:currentColor}
.tag{display:inline-block; font-size:10px; padding:1px 7px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-3)}
.s-ok{--st:var(--ok); --st-soft:var(--ok-soft); --st-line:var(--ok-line)}
.s-soon{--st:var(--warn); --st-soft:var(--warn-soft); --st-line:var(--warn-line)}
.s-over{--st:var(--over); --st-soft:var(--over-soft); --st-line:var(--over-line)}
.s-svc{--st:var(--warn); --st-soft:var(--warn-soft); --st-line:var(--warn-line)}
.s-q{--st:var(--cal); --st-soft:var(--cal-soft); --st-line:var(--cal-line)}
.s-none{--st:var(--ink-3); --st-soft:var(--surface-2); --st-line:var(--line-2)}

/* service block */
.svc{border:1px solid var(--warn-line); background:var(--warn-soft);
  border-radius:4px; padding:10px 12px; margin-top:11px}
.svc .r1{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.svc .st{font-size:12.5px; font-weight:600; color:var(--warn)}
.svc .cd{font-family:var(--f-num); font-size:19px; font-weight:500; color:var(--warn); font-variant-numeric:tabular-nums}
.svc .cd small{font-size:10px; font-family:var(--f-body); font-weight:400}
.svc .r2{font-size:11.5px; color:var(--ink-2); margin-top:5px; display:flex; gap:12px; flex-wrap:wrap}
.svc .r2 span{white-space:nowrap}
.svc .r2 a{color:var(--cal); text-decoration:none}

/* ---------- sort mode ---------- */
.sortlist{display:flex; flex-direction:column; gap:7px}
.sortrow{display:flex; align-items:center; gap:11px; background:var(--surface);
  border:1px solid var(--line-2); border-radius:var(--r); padding:9px 12px; box-shadow:var(--shadow)}
.sortrow.dragging{opacity:.55; border-style:dashed; box-shadow:none}
.handle{width:34px; height:38px; flex:none; display:grid; place-items:center; cursor:grab;
  touch-action:none; color:var(--ink-3); border:1px solid var(--line-2); border-radius:4px; background:var(--surface-2)}
.handle:active{cursor:grabbing}
.handle svg{display:block}
.sortrow .sid{min-width:0; flex:1}
.sortrow .sm{font-family:var(--f-display); font-size:16px; line-height:1.2}
.sortrow .sk{font-size:10.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase}
.updown{display:flex; flex-direction:column; gap:2px; flex:none}
.updown button{width:30px; height:19px; padding:0; font-size:11px; line-height:1;
  border:1px solid var(--line-2); background:var(--surface-2); border-radius:3px; color:var(--ink-2)}
.updown button:disabled{opacity:.3}

/* ---------- empty ---------- */
.empty{border:1px dashed var(--line-2); border-radius:var(--r); padding:40px 22px; text-align:center; background:var(--surface)}
.empty h2{font-family:var(--f-display); font-size:19px; font-weight:400; margin-bottom:8px}
.empty p{color:var(--ink-2); max-width:46ch; margin:0 auto 18px; font-size:13.5px}
.empty .acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

/* ---------- detail ---------- */
.back{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2);
  background:none; border:0; padding:14px 0}
.back:hover{color:var(--ink)}
.hero{position:relative; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 20px 20px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; overflow:hidden}
.hero::before{content:''; position:absolute; left:0; right:0; top:0; height:6px; background:var(--track); opacity:.9}
.hero .info{flex:1; min-width:225px}
.hero h2{font-family:var(--f-display); font-size:26px; font-weight:400; line-height:1.2; letter-spacing:.01em}
.hero .idrow{display:flex; gap:13px; align-items:center}
.hero .idrow img{width:64px; height:64px; border-radius:4px; object-fit:cover; border:1px solid var(--line-2); flex:none}
.ringwrap{position:relative; width:130px; height:130px; flex:none}
.ringwrap .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ringwrap .mid b{font-family:var(--f-num); font-size:26px; font-weight:500; line-height:1; color:var(--act); font-variant-numeric:tabular-nums}
.ringwrap .mid span{font-size:9.5px; color:var(--ink-3); margin-top:3px; letter-spacing:.04em}
.qbox{flex:none; text-align:center; padding:14px 22px; border:1px solid var(--line-2);
  border-left:3px solid var(--cal); border-radius:4px; background:var(--surface-2)}
.qbox .n{font-family:var(--f-num); font-size:34px; font-weight:500; line-height:1; color:var(--cal); font-variant-numeric:tabular-nums}
.qbox .k{font-size:10px; letter-spacing:.14em; color:var(--ink-3); margin-top:5px}

.dual{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.dual > div{border:1px solid var(--line); border-radius:4px; padding:10px 12px; background:var(--surface-2); border-left-width:3px}
.dual .d-cal{border-left-color:var(--cal)}
.dual .d-act{border-left-color:var(--act)}
.dual .k{font-size:9.5px; letter-spacing:.14em; color:var(--ink-3); text-transform:uppercase; font-family:var(--f-display)}
.dual .rem{font-family:var(--f-num); font-size:22px; font-weight:500; line-height:1.15; font-variant-numeric:tabular-nums}
.dual .rem small{font-size:11px; font-family:var(--f-body); font-weight:400; color:var(--ink-3)}
.dual .date{font-family:var(--f-mono); font-size:14px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums}
.dual .prog{font-size:10.5px; color:var(--ink-3); font-family:var(--f-mono); margin-top:3px}
@media(max-width:520px){ .dual{grid-template-columns:1fr} }
.hero .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}

.tabs{display:flex; gap:2px; margin:24px 0 0; border-bottom:1px solid var(--line-2); overflow-x:auto}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 14px; font-size:13.5px; color:var(--ink-3); white-space:nowrap; font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--acc)}
.panel{background:var(--surface); border:1px solid var(--line-2); border-top:0;
  border-radius:0 0 var(--r) var(--r); padding:20px; box-shadow:var(--shadow)}

.photo-full{width:100%; max-height:280px; object-fit:contain; border-radius:4px;
  background:var(--surface-2); border:1px solid var(--line); margin-bottom:16px}
.spec{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:4px; overflow:hidden}
.spec > div{background:var(--surface); padding:10px 13px}
.spec .k{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-family:var(--f-display)}
.spec .v{margin-top:2px; font-size:14px}
.spec .v.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
@media(max-width:560px){ .spec{grid-template-columns:1fr} }

.note{font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-left:3px solid var(--ink-3);
  border-radius:0 4px 4px 0; padding:11px 14px; margin-top:16px}
.note b{color:var(--ink); font-weight:500}
.note.warn{border-left-color:var(--warn)}
.note.blue{border-left-color:var(--cal)}

/* ---------- calendar ---------- */
.calbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.calbar .mo{font-family:var(--f-display); font-size:19px; font-weight:400; min-width:9ch; letter-spacing:.04em}
.calbar .nav2{display:flex; gap:4px; margin-left:auto}
.calbar .nav2 button{width:32px; height:32px; display:grid; place-items:center; padding:0}
.bulk{border:1px solid var(--line); background:var(--surface-2); border-radius:4px;
  padding:11px 12px; margin-bottom:14px; display:flex; flex-direction:column; gap:9px}
.bulk .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.bulk .lbl{font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-transform:uppercase; flex:none; font-family:var(--f-display)}
.dowpick{display:flex; gap:4px; flex-wrap:wrap}
.dowpick button{width:34px; height:34px; padding:0; border-radius:4px; border:1px solid var(--line-2);
  background:var(--surface); font-size:13px; display:grid; place-items:center}

function addYears(d,n){ return new Date(d.getFullYear()+n, d.getMonth(), d.getDate()); }

function mkey(y,m){ return y+'-'+pad(m); }

    if(/^[a-z][a-z0-9+.\-]*:/i.test(s)) return '';

  try{ var x = new URL(s); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; }

/* ============ state ============ */
var DEFAULT_CFG = { intervalYears:4, maxYears:8, carryDays:2, collectionSort:'due' };
var state = { watches:{}, usage:{}, photos:{}, shops:{}, wishes:{}, config:Object.assign({},DEFAULT_CFG) };

}
function apply(o){
  if(!o || typeof o !== 'object') return;
  state.watches = o.watches || {};
  state.usage   = o.usage   || {};
  state.photos  = o.photos  || {};
  state.shops   = o.shops   || {};

  catch(e){ toast('保存領域がいっぱいです。写真を減らすか、バックアップを書き出して整理してください。'); }

async function writeFile(){
  if(!fileHandle || filePerm !== 'granted') return;
  try{
    var w = await fileHandle.createWritable();
    await w.write(JSON.stringify(snapshotData(), null, 2));
    await w.close();

function idb(fn){

    var r;
    try{ r = indexedDB.open('watch-ledger', 1); }catch(e){ return res(null); }
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onerror = function(){ res(null); };
    r.onsuccess = function(){ try{ fn(r.result, res); }catch(e){ res(null); } };
  });

  var t = db.transaction('kv','readwrite').objectStore('kv').put(v,k);

          var o = JSON.parse(txt);
          var localAt = (JSON.parse(localStorage.getItem(LS)||'{}').savedAt) || '';

/* ---- photos ---- */
var PHOTO_BUDGET = 170000;
function loadPhoto(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(null); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null); };
    img.onload = function(){
      function encode(maxPx, q){
        var s = Math.min(1, maxPx / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width  = Math.max(1, Math.round(img.width  * s));
        cv.height = Math.max(1, Math.round(img.height * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        return cv.toDataURL('image/jpeg', q);
      }
      var q = 0.8, out = encode(900, q);
      while(out.length > PHOTO_BUDGET && q > 0.4){ q -= 0.12; out = encode(900, q); }
      if(out.length > PHOTO_BUDGET) out = encode(620, 0.62);
      if(out.length > PHOTO_BUDGET) out = encode(440, 0.55);
      cb(out.length > PHOTO_BUDGET ? null : out);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

var wq = {};
function enqueue(path, fn){
  var st = wq[path] || (wq[path] = {busy:false, latest:null});
  st.latest = fn;
  if(st.busy) return;
  st.busy = true;
  (async function(){
    try{ while(st.latest){ var f = st.latest; st.latest = null; await f(); } }
    catch(e){ toast('保存できませんでした（' + (e && (e.code||e.message) || '不明') + '）'); }
    finally{ st.busy = false; }
  })();
}

/* ============ the maintenance maths ============ */
function runningSet(u, carry){
  var set = {}, mm = (u && u.months) || {};
  Object.keys(mm).forEach(function(k){
    var p = k.split('-'), y = +p[0], m = +p[1];
    if(!y || !m) return;
    (mm[k]||[]).forEach(function(d){
      var s = serial(new Date(y, m-1, d));
      for(var i=0;i<=carry;i++) set[s+i] = 1;
    });
  });
  return set;
}
function isQuartz(w){ return w.movement === 'クオーツ'; }
function maintType(m){ return m.type === 'repair' ? 'repair' : 'overhaul'; }

function schedule(w, u, cfg){
  if(!w.purchaseDate) return null;
  var ms = (w.maintenances||[]).slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var ohs = ms.filter(function(m){ return maintType(m) === 'overhaul'; });
  var last = ohs.length ? ohs[ohs.length-1].date : null;
  var quartz = isQuartz(w);
  var baseStr = (quartz ? null : last) || w.purchaseDate;
  var base = parseYMD(baseStr), now = today();
  var elapsed = Math.max(0, diffDays(base, now));

  var carry = cfg.carryDays == null ? 2 : cfg.carryDays;
  var interval = cfg.intervalYears || 4;
  var target = diffDays(base, addYears(base, interval));
  var rs = runningSet(u, carry);
  var bs = serial(base), used = 0, hit = -1, span = Math.min(elapsed, 366*40);
  for(var i=0;i<span;i++){
    if(rs[bs+i]){ used++; if(hit < 0 && used >= target) hit = i; }
  }

  var out = { quartz:quartz, base:base, baseStr:baseStr,
    baseKind:(!quartz && last) ? 'overhaul' : 'purchase',
    elapsed:elapsed, used:used, carry:carry, maints:ms, overhauls:ohs,
    purchaseElapsed: Math.max(0, diffDays(parseYMD(w.purchaseDate), now)) };
  if(quartz) return out;

  var maxY = Math.max(interval, cfg.maxYears || 8);
  var maxDue = addYears(base, maxY);
  var dueCal = addYears(base, interval);
  var dueAct = hit >= 0 ? addDays(base, hit + 1) : addDays(now, Math.max(0, target - used));
  var capped = dueAct > maxDue;
  if(capped) dueAct = maxDue;

  out.interval = interval; out.maxY = maxY; out.target = target;
  out.dueCal = dueCal; out.remainCal = diffDays(now, dueCal);
  out.dueAct = dueAct; out.remainAct = diffDays(now, dueAct);
  out.capped = capped; out.maxDue = maxDue;
  out.progCal = Math.max(0, Math.min(1, elapsed / target));
  out.progAct = Math.max(0, Math.min(1, used / target));
  return out;
}

function statusOf(w, s){
  if(w && w.service) return {cls:'s-svc', label:'メンテナンス中'};
  if(!s) return {cls:'s-none', label:'購入日が未入力'};
  if(s.quartz) return {cls:'s-q', label:'クオーツ'};
  if(s.remainAct < 0)    return {cls:'s-over', label:'期限超過'};
  if(s.remainAct <= 180) return {cls:'s-soon', label:'要点検'};
  return {cls:'s-ok', label:'良好'};
}

/* {q} in a search URL is replaced with the model name */
function patrolUrl(shop, query){
  var raw = (shop.searchUrl && shop.searchUrl.trim()) ? shop.searchUrl : shop.url;
  var u = safeUrl(raw);
  if(!u) return '';
  if(u.indexOf('%7Bq%7D') >= 0 || u.indexOf('{q}') >= 0){
    return u.replace(/%7Bq%7D/gi, encodeURIComponent(query||'')).replace(/\{q\}/g, encodeURIComponent(query||''));
  }
  return u;
}

/* ============ ordering ============ */
function orderedWatchIds(){
  var ids = Object.keys(state.watches);
  var manual = state.config.collectionSort === 'manual';
  ids.sort(function(a,b){
    var wa = state.watches[a], wb = state.watches[b];
    if(manual){
      var oa = wa.order == null ? 1e9 : wa.order, ob = wb.order == null ? 1e9 : wb.order;
      if(oa !== ob) return oa - ob;
      return (wa.createdAt||'').localeCompare(wb.createdAt||'');
    }
    var sa = schedule(wa, state.usage[a], state.config);
    var sb = schedule(wb, state.usage[b], state.config);
    var qa = !sa || sa.quartz, qb = !sb || sb.quartz;
    if(qa !== qb) return qa ? 1 : -1;
    if(qa) return (wa.createdAt||'').localeCompare(wb.createdAt||'');
    return sa.remainAct - sb.remainAct;
  });
  return ids;
}
/* writes every changed row, then renders once */
function commitOrder(ids){
  ids.forEach(function(id, i){
    var w = state.watches[id];
    if(!w || w.order === i) return;
    var n = clone(w); n.order = i;
    state.watches[id] = n;
    if(mode === 'db'){
      (function(docId, body){
        enqueue('watches/' + docId, function(){ return DB.doc('watches/' + docId).set(body); });
      })(id, n);
    }
  });
  if(state.config.collectionSort !== 'manual'){
    state.config = Object.assign({}, state.config, {collectionSort:'manual'});
    if(mode === 'db') enqueue('config/app', function(){ return DB.doc('config/app').set(state.config); });
  }
  if(mode !== 'db') saveLocal();
  render();
}

/* ============ usage helpers ============ */
function wornOn(id, d){
  var u = state.usage[id];
  if(!u || !u.months) return false;
  var arr = u.months[mkey(d.getFullYear(), d.getMonth()+1)] || [];
  return arr.indexOf(d.getDate()) >= 0;
}
function toggleDay(id, d){
  var u = state.usage[id] ? clone(state.usage[id]) : {months:{}};
  u.months = u.months || {};
  var key = mkey(d.getFullYear(), d.getMonth()+1);
  var arr = (u.months[key] || []).slice();
  var i = arr.indexOf(d.getDate()), added;
  if(i >= 0){ arr.splice(i,1); added = false; } else { arr.push(d.getDate()); added = true; }
  if(arr.length) u.months[key] = arr.sort(function(a,b){ return a-b; });
  else delete u.months[key];
  putUsage(id, u);
  return added;
}

function watchCard(id, cfg){
  var w = state.watches[id];
  var sc = schedule(w, state.usage[id], cfg);
  var st = statusOf(w, sc);
  var n = today(), yst = addDays(n, -1);
  var onToday = wornOn(id, n), onYest = wornOn(id, yst);

  var h = '<div class="card st-line ' + st.cls + '">'
    + '<div class="ctop"><div class="cid" data-open="' + esc(id) + '" style="cursor:pointer">'
    + thumbHTML(id, 'thumb')
    + '<div style="min-width:0">'
    + '<div class="maker">' + esc(w.maker || 'メーカー未設定') + '</div>'
    + '<div class="model">' + esc(w.model) + '</div>'
    + '<div class="meta">' + esc(specLine(w)) + '</div>'
    + '<div class="ages">' + agesLine(w, sc) + '</div>'
    + '</div></div>';

  if(w.service){

function dualRing(pCal, pAct, midHTML){
  function arc(r, w, v, p){
    var c = 2*Math.PI*r;
    return '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--line-2)" stroke-width="' + w + '" opacity=".5"/>'
      + '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(' + v + ')" stroke-width="' + w + '"'
      + ' stroke-linecap="butt" stroke-dasharray="' + c.toFixed(1) + '"'
      + ' stroke-dashoffset="' + (c*(1-Math.max(0,Math.min(1,p)))).toFixed(1) + '" transform="rotate(-90 65 65)"/>';
  }
  return '<div class="ringwrap"><svg viewBox="0 0 130 130" width="130" height="130" aria-hidden="true">'
    + arc(56, 8, '--cal', pCal) + arc(39, 6, '--act', pAct) + '</svg>' + midHTML + '</div>';
}

function calendarHTML(w, u, cfg){
  var now = today();
  if(!cal) cal = {y:now.getFullYear(), m:now.getMonth()+1};
  var carry = cfg.carryDays == null ? 2 : cfg.carryDays;
  var key = mkey(cal.y, cal.m);
  var days = (u.months && u.months[key]) || [];
  var worn = {}; days.forEach(function(d){ worn[d]=1; });
  var dim = daysInMonth(cal.y, cal.m);
  var startDow = new Date(cal.y, cal.m-1, 1).getDay();
  var first = serial(new Date(cal.y, cal.m-1, 1));
  var rs = runningSet(u, carry), run = 0, i;
  for(i=0;i<dim;i++) if(rs[first+i]) run++;
  var futureMonth = (cal.y > now.getFullYear()) || (cal.y===now.getFullYear() && cal.m > now.getMonth()+1);

  var h = '<div class="calbar"><span class="mo">' + cal.y + '年 ' + cal.m + '月</span>'
    + '<button class="btn btn-ghost btn-sm" data-act="thismonth">今月へ</button>'
    + '<span class="nav2"><button class="btn" data-act="prevmo" aria-label="前の月">‹</button>'
    + '<button class="btn" data-act="nextmo" aria-label="次の月"' + (futureMonth?' disabled':'') + '>›</button></span></div>';

  h += '<div class="bulk"><div class="row"><span class="lbl">まとめ入力</span>'
    + '<button class="btn btn-sm btn-primary" data-act="bulkall">この月を全日</button>'
    + '<button class="btn btn-sm" data-act="bulkclear">この月をクリア</button></div>'
    + '<div class="row"><span class="lbl">曜日で</span><span class="dowpick">';
  for(i=0;i<7;i++){
    h += '<button type="button" data-dow="' + i + '" aria-pressed="' + !!dowSel[i] + '"'
      + (i===0?' style="color:var(--over)"':'') + '>' + DOW[i] + '</button>';
  }
  h += '</span><button class="btn btn-sm" data-act="bulkdow">選んだ曜日を追加</button></div></div>';

  h += '<div class="dow">';
  for(i=0;i<7;i++) h += '<span>' + DOW[i] + '</span>';
  h += '</div><div class="days">';
  for(i=0;i<startDow;i++) h += '<div class="day blank"></div>';
  for(var d=1; d<=dim; d++){
    var dd = new Date(cal.y, cal.m-1, d);
    var cls = worn[d] ? ' on' : (rs[first+d-1] ? ' run' : '');
    h += '<button class="day' + cls + (ymd(dd)===ymd(now)?' today':'') + '"'
      + (dd>now?' disabled':'') + ' data-day="' + d + '" aria-pressed="' + (!!worn[d])
      + '" aria-label="' + cal.m + '月' + d + '日">' + d + '</button>';
  }
  h += '</div>';

  h += '<div class="legend"><span><i class="w"></i>着用した日</span>'
    + '<span><i class="r"></i>ゼンマイで稼働中（最終着用の ' + carry + ' 日後まで）</span>'
    + '<span><i class="n"></i>停止</span></div>';

  h += '<div class="mstats">'
    + '<div><div class="k">着用日数</div><div class="v">' + days.length + '</div></div>'
    + '<div><div class="k">稼働日数</div><div class="v t-act">' + run + ' <span style="font-size:11px;color:var(--ink-3)">/ ' + dim + '</span></div></div>'
    + '<div><div class="k">停止日数</div><div class="v" style="color:var(--ink-3)">' + (dim-run) + '</div></div>'
    + '</div>';

  h += '<div class="note">' + (isQuartz(w)
    ? 'クオーツのため、この記録はオーバーホール時期の計算には使われません。'
    : '着けた日から <b>' + carry + ' 日後</b>までが稼働日です。連続して着けた場合は、'
      + '<b>最後に着けた日の ' + carry + ' 日後</b>まで。この稼働日を積み上げて '
      + (cfg.intervalYears||4) + ' 年分になった日が次回オーバーホールの時期です。') + '</div>';
  return h;
}

function calcHTML(id, sc, cfg){
  if(!sc) return '<p style="color:var(--ink-2)">購入時期が未入力のため計算できません。</p>';
  var u = state.usage[id] || {months:{}};
  var rs = runningSet(u, sc.carry);
  var now = today(), bs = serial(sc.base), ns = serial(now);
  var rows = [], cum = 0;
  var y = sc.base.getFullYear(), m = sc.base.getMonth()+1;
  var ey = now.getFullYear(), em = now.getMonth()+1, guard = 0;
  while((y < ey || (y === ey && m <= em)) && guard++ < 400){
    var dim = daysInMonth(y, m), ms0 = serial(new Date(y, m-1, 1));
    var from = Math.max(ms0, bs), to = Math.min(ms0 + dim - 1, ns - 1);
    if(to >= from){
      var inRange = to - from + 1, run = 0, wornN = 0;
      for(var s = from; s <= to; s++) if(rs[s]) run++;
      (u.months[mkey(y,m)] || []).forEach(function(d){
        var sd = ms0 + d - 1; if(sd >= from && sd <= to) wornN++;
      });
      cum += run;
      rows.push({y:y, m:m, inRange:inRange, worn:wornN, run:run, cum:cum, partial:inRange < dim});
    }
    m++; if(m>12){ m=1; y++; }
  }
  if(!rows.length) return '<p style="color:var(--ink-2)">起算日（' + esc(jpDate(sc.baseStr)) + '）からまだ 1 日も経っていません。</p>';

  var shown = view.showAll ? rows.slice().reverse() : rows.slice(-24).reverse();

      + '<td>' + r.y + '.' + pad(r.m) + (r.partial ? ' <span style="font-family:var(--f-body);font-size:11px">一部</span>' : '') + '</td>'
      + '<td>' + r.inRange + '</td><td>' + r.worn + '</td><td class="t-act">' + r.run + '</td>'
      + '<td style="color:var(--ink-3)">' + (r.inRange-r.run) + '</td><td>' + r.cum + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td>合計</td><td>' + sc.elapsed + '</td><td></td><td class="t-act">' + sc.used
    + '</td><td>' + (sc.elapsed-sc.used) + '</td><td>' + sc.used + '</td></tr></tfoot></table></div>';

    h += '<div style="margin-top:12px"><button class="btn" data-act="toggleall">'
      + (view.showAll ? '直近 24 か月だけ表示' : 'すべての ' + rows.length + ' か月を表示') + '</button></div>';
  }
  h += '<div class="note"><span class="t-cal">基準</span>：起算日から暦どおり ' + sc.interval + ' 年後の '
    + esc(jpDate(ymd(sc.dueCal))) + '。使用の有無に関係しません。'
    + '<br><span class="t-act">実質</span>：稼働日が ' + sc.target + ' 日に達する日。現在 ' + sc.used
    + ' 日なので、明日から毎日着けたとして ' + esc(jpDate(ymd(sc.dueAct))) + '。</div>';
  return h;
}

      + '</div></div>'
      + '<span class="prio p' + pr + '">' + (pr===1?'高':pr===2?'中':'低') + '</span>'
      + '</div>'
      + '<div class="wprice">'
      + '<div><div class="k">希望価格</div><div class="v t-act">' + esc(yen(k.targetPrice)) + '</div></div>'
      + (k.listPrice ? '<div><div class="k">定価</div><div class="v">' + esc(yen(k.listPrice)) + '</div></div>' : '')
      + (k.budget ? '<div><div class="k">上限</div><div class="v">' + esc(yen(k.budget)) + '</div></div>' : '')
      + '</div>';

    if(k.memo) h += '<div style="font-size:12px;color:var(--ink-2);margin-top:8px">' + esc(k.memo) + '</div>';

    if(shops.length){
      h += '<div class="shopchips">';
      shops.forEach(function(s){ h += '<span class="sc">' + esc(state.shops[s].name) + '</span>'; });
      h += '</div>';
    }

    h += '<div class="quick">'
      + (shops.length
        ? '<button class="qb on" data-act="patrol" data-id="' + esc(id) + '">巡回する（' + shops.length + '店）</button>'

      + '</div></div>';
  });
  return h + '</div>';
}

/* ============ combobox ============ */
var comboSource = 'maker';
function comboListHTML(filter){
  var f = (filter||'').trim().toLowerCase(), h = '', hits = 0;
  if(comboSource === 'shop'){
    var ids = sortedShops();
    var items = ids.filter(function(id){
      return !f || (state.shops[id].name||'').toLowerCase().indexOf(f) >= 0;
    });
    hits = items.length;
    if(hits){
      h += '<div class="g">登録した店</div>';
      items.forEach(function(id){
        var s = state.shops[id];
        h += '<button type="button" data-pickshop="' + esc(id) + '">' + esc(s.name)
          + (s.person ? '<span style="color:var(--ink-3);font-size:11.5px"> ／ ' + esc(s.person) + '</span>' : '')
          + '</button>';
      });
    }
    if(!hits) h = '<div class="none">一致する店がありません。そのまま入力しても登録できます（「利用店」から登録しておくとサイトを開けます）。</div>';
    return h;
  }
  MAKERS.forEach(function(g){
    var its = g[1].filter(function(n){ return !f || n.toLowerCase().indexOf(f) >= 0; });
    if(!its.length) return;
    hits += its.length;
    h += '<div class="g">' + esc(g[0]) + '</div>';
    its.forEach(function(n){ h += '<button type="button" data-maker="' + esc(n) + '">' + esc(n) + '</button>'; });
  });
  if(!hits) h = '<div class="none">一致するメーカーがありません。そのまま入力すれば登録できます。</div>';
  return h;
}
/* a form can hold more than one combobox, so each keeps its own list element */
function closeCombos(){
  [].forEach.call(document.querySelectorAll('.combo-list'), function(l){ l.hidden = true; });
}
function comboOpen(box, open, filter){
  var list = box && box.querySelector('.combo-list'); if(!list) return;
  if(open){
    comboSource = box.getAttribute('data-combo') || 'maker';
    list.innerHTML = comboListHTML(filter);
    list.hidden = false; list.scrollTop = 0;
  } else list.hidden = true;
}

var toastTimer = null;
function toast(msg){
  var old = $('.toast'); if(old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; el.setAttribute('role','status');
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 4000);
}

/* ============ bulk calendar entry ============ */
function editMonth(fn){
  var u = state.usage[view.detail] ? clone(state.usage[view.detail]) : {months:{}};
  u.months = u.months || {};
  var key = mkey(cal.y, cal.m);
  var next = fn((u.months[key] || []).slice());
  if(next.length) u.months[key] = next.sort(function(a,b){ return a-b; });
  else delete u.months[key];
  putUsage(view.detail, u);
}
function lastEditableDay(){
  var now = today(), dim = daysInMonth(cal.y, cal.m);
  if(cal.y === now.getFullYear() && cal.m === now.getMonth()+1) return now.getDate();
  if(new Date(cal.y, cal.m-1, 1) > now) return 0;
  return dim;
}

/* ============ drag to reorder ============ */
var drag = null;
document.addEventListener('pointerdown', function(e){
  var handle = e.target.closest('[data-handle]');
  if(!handle) return;
  var row = handle.closest('.sortrow');
  var list = $('#sortlist');
  if(!row || !list) return;
  e.preventDefault();
  drag = {row:row, list:list, id:handle.getAttribute('data-handle')};
  row.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
  drag.handle = handle;
});
document.addEventListener('pointermove', function(e){
  if(!drag) return;
  e.preventDefault();
  var rows = [].slice.call(drag.list.querySelectorAll('.sortrow:not(.dragging)'));
  var after = rows.reduce(function(closest, child){
    var box = child.getBoundingClientRect();
    var offset = e.clientY - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset:offset, el:child};
    return closest;
  }, {offset: Number.NEGATIVE_INFINITY, el:null}).el;
  if(after) drag.list.insertBefore(drag.row, after);
  else drag.list.appendChild(drag.row);
});
document.addEventListener('pointerup', function(){
  if(!drag) return;
  drag.row.classList.remove('dragging');
  var ids = [].slice.call(drag.list.querySelectorAll('.sortrow')).map(function(r){ return r.getAttribute('data-sid'); });
  drag = null;
  commitOrder(ids);
  render();
});
document.addEventListener('pointercancel', function(){
  if(!drag) return;
  drag.row.classList.remove('dragging');
  drag = null; render();
});

/* ============ events ============ */
document.addEventListener('click', function(e){
  if(e.target.id === 'veil'){ closeModal(); return; }

  /* patrol links: mark done, then let the browser open the tab */
  var pg = e.target.closest('[data-patrolgo]');
  if(pg && patrol){
    patrol.done[pg.getAttribute('data-patrolgo')] = true;
    setTimeout(patrolSheet, 60);
    return;
  }
  if(e.target.closest('a[href]')) return;

  var t = e.target.closest('[data-open],[data-act],[data-tab],[data-day],[data-seg],[data-dow],'
    + '[data-delmaint],[data-combo-toggle],[data-maker],[data-pickshop],[data-page],[data-wear],'
    + '[data-mv-up],[data-mv-down]');

  if(!e.target.closest('.combo')) closeCombos();
  if(!t) return;
  var act = t.getAttribute('data-act');

  if(t.hasAttribute('data-page')){
    view.page = t.getAttribute('data-page'); view.detail = null; view.sortMode = false;
    window.scrollTo(0,0); render(); return;
  }
  if(t.hasAttribute('data-combo-toggle')){
    var tbox = t.closest('.combo');
    var wasHidden = tbox.querySelector('.combo-list').hidden;
    closeCombos();
    if(wasHidden) comboOpen(tbox, true, '');
    return;
  }
  if(t.hasAttribute('data-maker')){
    var mbox = t.closest('.combo');
    mbox.querySelector('input').value = t.getAttribute('data-maker');
    comboOpen(mbox, false); return;
  }
  if(t.hasAttribute('data-pickshop')){
    var sid = t.getAttribute('data-pickshop'), sh = state.shops[sid];
    var box = t.closest('.combo'), inp = box.querySelector('input');
    inp.value = sh.name;
    var hid = inp.id === 'f_shop' ? '#f_shopId' : inp.id === 'm_shop' ? '#m_shopId' : '#v_shopId';
    if($(hid)) $(hid).value = sid;
    if(inp.id === 'v_shop'){
      if($('#v_person') && !$('#v_person').value) $('#v_person').value = sh.person || '';
      if($('#v_tel') && !$('#v_tel').value) $('#v_tel').value = sh.tel || '';
    }
    comboOpen(box, false); return;
  }
  if(t.hasAttribute('data-open')){
    view.detail = t.getAttribute('data-open'); view.tab = 'overview'; view.showAll = false;
    cal = null; window.scrollTo(0,0); render(); return;
  }
  if(t.hasAttribute('data-tab')){ view.tab = t.getAttribute('data-tab'); render(); return; }
  if(t.hasAttribute('data-seg')){
    Array.prototype.forEach.call(t.parentNode.children, function(b){ b.setAttribute('aria-pressed', b===t); });
    return;
  }
  if(t.hasAttribute('data-dow')){
    var k0 = +t.getAttribute('data-dow');
    dowSel[k0] = !dowSel[k0];
    t.setAttribute('aria-pressed', !!dowSel[k0]);
    return;
  }
  if(t.hasAttribute('data-wear')){
    var wid0 = t.getAttribute('data-wear');
    var off = +t.getAttribute('data-off');
    var d0 = addDays(today(), -off);
    var added = toggleDay(wid0, d0);
    toast((off ? '昨日' : '今日') + '（' + jpDate(ymd(d0)) + '）を' + (added ? '着用として記録しました' : '記録から外しました'));
    return;
  }
  /* カレンダーの日付を直接タップして登録・取り消し */
  if(t.hasAttribute('data-day')){
    var dnum = +t.getAttribute('data-day');
    editMonth(function(arr){
      var ix = arr.indexOf(dnum);
      if(ix >= 0) arr.splice(ix, 1); else arr.push(dnum);
      return arr;
    });
    return;
  }
  if(t.hasAttribute('data-mv-up') || t.hasAttribute('data-mv-down')){
    var mid0 = t.getAttribute('data-mv-up') || t.getAttribute('data-mv-down');
    var dir = t.hasAttribute('data-mv-up') ? -1 : 1;
    var ord = orderedWatchIds();
    var ix = ord.indexOf(mid0), jx = ix + dir;
    if(ix < 0 || jx < 0 || jx >= ord.length) return;
    ord.splice(jx, 0, ord.splice(ix, 1)[0]);
    commitOrder(ord); render(); return;
  }
  if(t.hasAttribute('data-delmaint')){
    var mid = t.getAttribute('data-delmaint');
    var w2 = clone(state.watches[view.detail]);
    w2.maintenances = (w2.maintenances||[]).filter(function(m){ return m.id !== mid; });
    putWatch(view.detail, w2);
    toast('記録を削除しました');
    return;
  }

  switch(act){
    case 'add':
      if(view.page==='wish') wishForm(null);
      else if(view.page==='shops') shopForm(null);
      else watchForm(null);
      break;
    case 'addshop': shopForm(null); break;
    case 'addwish': wishForm(null); break;
    case 'editshop': shopForm(t.getAttribute('data-id')); break;
    case 'editwish': wishForm(t.getAttribute('data-id')); break;
    case 'back': view.detail = null; window.scrollTo(0,0); render(); break;
    case 'edit': watchForm(view.detail); break;
    case 'addmaint': maintForm(t.getAttribute('data-id') || view.detail); break;
    case 'svcedit': serviceForm(t.getAttribute('data-id') || view.detail); break;
    case 'cancel': closeModal(); break;
    case 'toggleall': view.showAll = !view.showAll; render(); break;
    case 'thismonth': var n1 = today(); cal = {y:n1.getFullYear(), m:n1.getMonth()+1}; render(); break;
    case 'prevmo': cal.m--; if(cal.m<1){cal.m=12; cal.y--;} render(); break;
    case 'nextmo': cal.m++; if(cal.m>12){cal.m=1; cal.y++;} render(); break;
    case 'sample': loadSample(); break;
    case 'linkfile': linkFile(); break;
    case 'unlinkfile': unlinkFile(); break;
    case 'reconnect': reconnectFile(true); break;
    case 'export': exportBackup(); break;
    case 'import': $('#impFile').click(); break;
    case 'pickphoto': $('#photoFile').click(); break;
    case 'sortmode': view.sortMode = true; render(); break;
    case 'sortdone': view.sortMode = false; render(); toast('並び順を保存しました'); break;
    case 'togglesort': {
      var c0 = Object.assign({}, state.config,
        {collectionSort: state.config.collectionSort === 'manual' ? 'due' : 'manual'});
      putConfig(c0);
      toast(c0.collectionSort === 'manual' ? '自分で決めた並びで表示します' : '実質の期限が近い順で表示します');
      break;
    }

    case 'rmphoto': {
      formPhoto = null;
      var pv = $('#photoPreview');
      if(pv) pv.outerHTML = '<span id="photoPreview" class="pv ph" aria-hidden="true">⌚</span>';
      t.hidden = true;
      break;
    }

    case 'bulkall': {
      var lastD = lastEditableDay();
      if(!lastD){ toast('未来の月には登録できません。'); break; }
      editMonth(function(){ var a=[]; for(var i=1;i<=lastD;i++) a.push(i); return a; });

        person: $('#s_person').value.trim(),
        tel: $('#s_tel').value.trim(),
        address: $('#s_addr').value.trim(),
        url: $('#s_url').value.trim(),
        searchUrl: $('#s_surl').value.trim(),
        memo: $('#s_memo').value.trim(),
        order: prevS && prevS.order != null ? prevS.order : Object.keys(state.shops).length,
        createdAt: prevS ? prevS.createdAt : new Date().toISOString()
      });
      closeModal();
      toast(shid ? '保存しました' : '「' + nm2 + '」を追加しました');
      break;
    }
    case 'delshop': {
      if(t.getAttribute('data-confirm') !== '1'){
        t.setAttribute('data-confirm','1'); t.textContent = '本当に削除しますか？'; return;
      }
      removeShop(t.getAttribute('data-id')); closeModal(); toast('店を削除しました');
      break;
    }

    case 'savewish': {
      var kid = t.getAttribute('data-id') || '';
      var km = $('#k_model').value.trim();
      if(!km){ $('#k_err').textContent = 'モデル名を入力してください。'; $('#k_model').focus(); return; }
      var prevK = kid ? state.wishes[kid] : null;
      var prioB = $('#k_prio').querySelector('[aria-pressed="true"]');
      var prioTxt = prioB ? prioB.getAttribute('data-seg') : '中';
      var condB = $('#k_cond').querySelector('[aria-pressed="true"]');
      var picks = [].slice.call($('#k_shops').querySelectorAll('input:checked')).map(function(i){ return i.value; });
      var newKid = kid || uid('k');
      var kPhoto = formPhoto;
      var kHad = (state.photos[newKid] && state.photos[newKid].dataUrl) || null;
      put('wishes', newKid, {
        model: km,
        maker: $('#k_maker').value.trim(),
        ref: $('#k_ref').value.trim(),
        condPref: condB ? condB.getAttribute('data-seg') : 'どちらでも',
        targetPrice: $('#k_target').value !== '' ? +$('#k_target').value : null,
        listPrice: $('#k_list').value !== '' ? +$('#k_list').value : null,
        budget: $('#k_budget').value !== '' ? +$('#k_budget').value : null,
        priority: prioTxt === '高' ? 1 : prioTxt === '低' ? 3 : 2,
        shopIds: picks,
        memo: $('#k_memo').value.trim(),
        lastChecked: prevK ? (prevK.lastChecked||'') : '',
        order: prevK && prevK.order != null ? prevK.order : Object.keys(state.wishes).length,
        createdAt: prevK ? prevK.createdAt : new Date().toISOString()
      });
      if(kPhoto){ if(kPhoto !== kHad) putPhoto(newKid, kPhoto); }
      else if(kHad) putPhoto(newKid, null);
      closeModal();
      view.page = 'wish'; render();
      toast(kid ? '保存しました' : '「' + km + '」を検討リストに追加しました');
      break;
    }
    case 'delwish': {
      if(t.getAttribute('data-confirm') !== '1'){
        t.setAttribute('data-confirm','1'); t.textContent = '本当に削除しますか？'; return;
      }
      removeWish(t.getAttribute('data-id')); closeModal(); toast('検討リストから削除しました');
      break;
    }

    case 'patrol': {
      patrol = {wishId: t.getAttribute('data-id'), done:{}};
      patrolSheet();
      break;
    }
    case 'patroldone': {
      var pid = t.getAttribute('data-id');
      var kk = clone(state.wishes[pid]);
      kk.lastChecked = ymd(today());
      put('wishes', pid, kk);
      closeModal();
      toast('今日チェックしたと記録しました');
      break;
    }

    case 'savecfg': {
      var yrs = Math.max(1, Math.min(20, +$('#s_years').value || 4));
      var mx  = +$('#s_max').value || 8;
      var cy  = $('#s_carry').value === '' ? 2 : +$('#s_carry').value;
      putConfig(Object.assign({}, state.config, {
        intervalYears: yrs,
        maxYears: Math.max(yrs, Math.min(30, mx)),
        carryDays: Math.max(0, Math.min(10, cy))
      }));
      closeModal(); toast('設定を保存しました');
      break;
    }

    case 'delete': {
      var did = t.getAttribute('data-id');
      var nm = state.watches[did] ? state.watches[did].model : '';
      if(t.getAttribute('data-confirm') !== '1'){
        t.setAttribute('data-confirm','1'); t.textContent = '本当に削除しますか？'; return;
      }
      removeWatch(did); closeModal(); view.detail = null; render();
      toast('「' + nm + '」を削除しました');
      break;
    }
  }
});

/* ============ boot & sync ============ */
function badge(txt, title){ var el = $('#modeBadge'); el.textContent = txt; el.title = title || ''; }
function onDbErr(e){ if(e && e.code === 'revoked') return; toast('同期エラー（' + (e && e.code || '不明') + '）'); }
function subColl(name){
  DB.collection(name).onSnapshot(function(s){
    var o = {}; s.docs.forEach(function(d){ o[d.id] = d.data(); });
    state[name] = o; render();
  }, onDbErr);
}
function subscribe(){
  try{
    ['watches','usage','photos','shops','wishes'].forEach(subColl);
    DB.doc('config/app').onSnapshot(function(s){
      if(s.exists) state.config = Object.assign({}, DEFAULT_CFG, s.data());
      render();
    }, onDbErr);
  }catch(e){ onDbErr(e); }
}
async function connect(){
  var db = null;
  try{ db = IS_HOSTED ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){
    badge('この端末に保存', 'データはこの端末の中に保存されます。');
    try{ var h = await idbGet('fileHandle'); if(h){ fileHandle = h; await reconnectFile(false); } }catch(e){}
    renderBanner(); render();
    return;
  }
  DB = db;
  try{
    var snap = await DB.collection('watches').get();
    if(snap.empty && Object.keys(state.watches).length) await pushAllToDb();
  }catch(e){ badge('この端末に保存'); onDbErr(e); return; }
  mode = 'db';
  badge('クラウド同期', 'データはこのアーティファクトに保存され、どの端末からでも同じ内容が見られます。');
  subscribe();
}

loadLocal();
render();
renderBanner();
connect();

  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadController || reloading) return;
    reloading = true; location.reload();
  });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
})();
